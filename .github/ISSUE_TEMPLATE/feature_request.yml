name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明要解决的问题,再描述方案。范围应尽量聚焦;与本项目“纯本地、用户自配端点”的定位一致。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前哪里不顺手?谁会受益?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: textarea
    id: scope
    attributes:
      label: 影响范围 / 风险
      description: 是否涉及数据库 schema、上下文组装、生图插件契约或平台差异?
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过已有 issue
          required: true
        - label: 建议内容不包含破限/露骨成人素材或未授权第三方内容
          required: true
